[build]
  command = "npm run build"
  publish = "dist"

# React app under /app/* (MPA) — deep links must hit app/index.html
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Marketing homepage is dist/index.html at /
# Do not catch-all rewrite everything to root (that breaks /app).
